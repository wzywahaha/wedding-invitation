<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>张伟 &amp; 李婷 的婚礼邀请函</title>
<!-- ═══════════ 微信分享卡片（部署到 GitHub Pages 后请把 og:image 替换为绝对地址）═══════════ -->
<meta property="og:title" content="张伟 &amp; 李婷 的婚礼邀请函">
<meta property="og:description" content="2026年10月1日 · 星期四 · 某某大酒店 诚邀您的光临">
<meta property="og:image" content="https://wzywahaha.github.io/wedding-invitation/cover.jpg">
<meta property="og:type" content="website">
<style>
/* ═══════════ ① 变量 ═══════════ */
:root {
  --bg: #FBF9F5;        /* 暖白底 */
  --ink: #33302B;       /* 主文字 */
  --sub: #8C867C;       /* 次级文字 */
  --gold: #B99A5E;      /* 香槟金 */
  --gold-light: #D9C69B;
  --line: #E5E0D6;      /* 细线 */
  --card: #FFFFFF;
  --serif: Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
  --sans: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}

/* ═══════════ ② reset ═══════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.9;
  color: var(--ink);
  background: var(--bg);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
img { display: block; }

/* ═══════════ ③ 花瓣 ═══════════ */
.petals {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 5;
}
.petal {
  position: absolute;
  top: -6vh;
  border-radius: 60% 0 60% 0;
  background: linear-gradient(135deg, #E3CE9F 0%, #C9AD72 55%, #B99A5E 100%);
  opacity: var(--op, .45);
  will-change: transform;
  animation: petal-fall var(--dur) linear var(--delay) infinite;
}
@keyframes petal-fall {
  0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
  25%  { transform: translate3d(var(--drift), 28vh, 0) rotate(var(--rot1)); }
  50%  { transform: translate3d(var(--driftN), 56vh, 0) rotate(var(--rot2)); }
  75%  { transform: translate3d(var(--drift), 84vh, 0) rotate(var(--rot3)); }
  100% { transform: translate3d(var(--driftN), 112vh, 0) rotate(var(--rot4)); }
}
@media (prefers-reduced-motion: reduce) {
  .petals { display: none; }
}

/* ═══════════ ④ 音乐按钮 ═══════════ */
.music-btn {
  position: fixed;
  right: 16px;
  bottom: 24px;
  width: 48px; height: 48px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,.92);
  box-shadow: 0 4px 16px rgba(51,48,43,.18);
  z-index: 10;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.music-btn svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.music-btn .disc {
  position: absolute;
  top: -3px; left: -3px;
  width: 54px; height: 54px;
  border: 1px dashed var(--gold);
  border-radius: 50%;
  animation: spin 8s linear infinite;
  animation-play-state: paused;
}
.music-btn.playing .disc { animation-play-state: running; }
.music-btn.music-error { opacity: .35; }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

/* ═══════════ ⑤ 封面 hero ═══════════ */
.hero {
  position: relative;
  min-height: 100vh;
  height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px 64px;
}
.hero-inner { opacity: 0; transform: translateY(18px); transition: opacity 1.2s ease, transform 1.2s ease; }
body.ready .hero-inner { opacity: 1; transform: none; }

.hero-kicker {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 12px;
  letter-spacing: .42em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 30px;
}
.cover-photo {
  position: relative;
  width: 236px; height: 296px;
  margin: 0 auto 34px;
  border-radius: 118px 118px 0 0;
  background: linear-gradient(160deg, #F0EADA 0%, #E6DCC8 100%);
  overflow: hidden;
  box-shadow: 0 12px 32px rgba(51,48,43,.10);
}
.cover-photo::after {              /* 内衬细线拱门 */
  content: "";
  position: absolute;
  top: 10px; left: 10px; right: 10px; bottom: 0;
  border: 1px solid rgba(185,154,94,.5);
  border-bottom: none;
  border-radius: 108px 108px 0 0;
  pointer-events: none;
}
.cover-photo.has-photo::after { display: none; }
.cover-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 118px 118px 0 0;
}
.photo-hint {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--sub);
  font-size: 12px;
  letter-spacing: .2em;
}
.photo-hint svg { opacity: .55; }
.cover-photo.has-photo .photo-hint { display: none; }

.hero-names {
  font-family: var(--serif);
  font-size: 34px;
  font-weight: normal;
  letter-spacing: .35em;
  text-indent: .35em;              /* 平衡字距造成的偏移 */
  color: var(--ink);
  margin-bottom: 22px;
}
.hero-names .amp {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 22px;
  color: var(--gold);
  vertical-align: 8px;
  margin: 0 6px;
}
.gold-line {
  width: 52px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 22px;
}
.hero-date {
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: .18em;
  color: var(--sub);
  margin-bottom: 6px;
}
.hero-lunar {
  font-size: 13px;
  letter-spacing: .3em;
  color: var(--gold);
}
.scroll-hint {
  position: absolute;
  bottom: 26px; left: 50%;
  transform: translateX(-50%);
  color: var(--gold-light);
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: .4em;
  animation: float 2.4s ease-in-out infinite;
}
@keyframes float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 8px); } }

/* ═══════════ ⑥ 邀请正文 ═══════════ */
.invite {
  padding: 72px 32px;
  text-align: center;
}
.invite-title {
  font-size: 26px;
  letter-spacing: .6em;
  text-indent: .6em;
  color: var(--ink);
  margin-bottom: 30px;
}
.invitee-name {
  font-family: var(--serif);
  font-size: 20px;
  letter-spacing: .12em;
  color: var(--gold);
  margin-bottom: 30px;
}
.invite-text {
  max-width: 460px;
  margin: 0 auto;
  color: #57524A;
  font-size: 15px;
}
.invite-text p { margin-bottom: 14px; }
.invite-text .em { color: var(--gold); }
.invite-sign {
  margin-top: 34px;
  font-size: 13px;
  letter-spacing: .24em;
  color: var(--sub);
}

/* ═══════════ ⑦ 婚礼信息 ═══════════ */
.info {
  padding: 0 24px 72px;
}
.section-head {
  text-align: center;
  margin-bottom: 36px;
}
.section-head .en {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 11px;
  letter-spacing: .4em;
  text-transform: uppercase;
  color: var(--gold-light);
  display: block;
  margin-bottom: 8px;
}
.section-head .cn {
  font-size: 20px;
  letter-spacing: .5em;
  text-indent: .5em;
  color: var(--ink);
}
.info-card {
  max-width: 560px;
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 40px 30px;
  box-shadow: 0 10px 30px rgba(51,48,43,.06);
}
.info-row {
  display: flex;
  align-items: baseline;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.info-row:last-child { border-bottom: none; }
.info-row .label {
  flex: 0 0 76px;
  font-size: 12px;
  letter-spacing: .3em;
  color: var(--gold);
}
.info-row .value {
  flex: 1;
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: .06em;
  color: var(--ink);
}
.schedule {
  margin-top: 26px;
}
.schedule-title {
  text-align: center;
  font-size: 12px;
  letter-spacing: .4em;
  color: var(--gold);
  margin-bottom: 20px;
}
.schedule-item {
  display: flex;
  align-items: center;
  margin-bottom: 18px;
}
.schedule-item .s-time {
  flex: 0 0 64px;
  font-family: Georgia, serif;
  font-size: 16px;
  letter-spacing: .08em;
  color: var(--gold);
  text-align: right;
}
.schedule-item .s-dot {
  flex: 0 0 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.schedule-item .s-dot::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 0 0 3px rgba(217,198,155,.35);
}
.schedule-item .s-text {
  flex: 1;
  font-size: 15px;
  letter-spacing: .1em;
  color: #57524A;
}

/* ═══════════ ⑧ 地图与交通 ═══════════ */
.map-section {
  padding: 0 24px 72px;
}
.traffic-list {
  max-width: 560px;
  margin: 0 auto 34px;
}
.traffic-item {
  display: flex;
  align-items: flex-start;
  padding: 12px 0;
}
.traffic-item .t-icon {
  flex: 0 0 40px;
  color: var(--gold);
  padding-top: 2px;
}
.traffic-item .t-text {
  flex: 1;
  font-size: 14.5px;
  color: #57524A;
  letter-spacing: .04em;
}
.map-box {
  position: relative;
  max-width: 560px;
  margin: 0 auto;
  padding-bottom: 72%;          /* 高度占位 hack（老内核兼容） */
  border-radius: 4px;
  overflow: hidden;
  background: var(--card);
}
.map-box iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100% !important;
  height: 100% !important;
  border: 0;
}
.map-placeholder {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 2px dashed var(--gold-light);
  border-radius: 4px;
  color: var(--sub);
  font-size: 12px;
  letter-spacing: .14em;
  text-align: center;
  padding: 20px;
}
.map-placeholder svg { opacity: .5; }

/* ═══════════ ⑨ 页脚 ═══════════ */
.footer {
  padding: 72px 24px 90px;
  text-align: center;
}
.footer-bless {
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: .14em;
  line-height: 2.3;
  color: #57524A;
  margin-bottom: 36px;
}
.footer-names {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: .2em;
  color: var(--gold);
}
.footer-date {
  margin-top: 10px;
  font-family: Georgia, serif;
  font-size: 12px;
  letter-spacing: .3em;
  color: var(--sub);
}

/* ═══════════ ⑩ 滚动淡入 ═══════════ */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity .9s ease, transform .9s ease;
}
.reveal.is-visible { opacity: 1; transform: none; }

/* ═══════════ ⑪ 响应式 ═══════════ */
@media (min-width: 480px) {
  .hero-names { font-size: 40px; }
  .hero-date { font-size: 16px; }
  .invite-text { font-size: 16px; }
  .info-card { padding: 48px 40px; }
}
@media (min-width: 768px) {
  .page {
    max-width: 680px;
    margin: 0 auto;
    box-shadow: 0 0 60px rgba(51,48,43,.07);
    background: var(--bg);
  }
  .hero-names { font-size: 48px; }
  .cover-photo { width: 260px; height: 326px; border-radius: 130px 130px 0 0; }
  .cover-photo img { border-radius: 130px 130px 0 0; }
  .cover-photo::after { border-radius: 120px 120px 0 0; }
  .info-card { transition: box-shadow .3s ease; }
  .info-card:hover { box-shadow: 0 18px 44px rgba(51,48,43,.10); }
}
</style>
</head>
<body>

<!-- 花瓣层 -->
<div class="petals" id="petals" aria-hidden="true"></div>

<!-- 音乐开关 -->
<button class="music-btn" id="musicBtn" aria-label="音乐开关" title="点击播放背景音乐">
  <span class="disc"></span>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <path d="M9 18V6.5L19 4v11.5" stroke="#B99A5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6.5" cy="18" r="2.5" fill="#B99A5E"/>
    <circle cx="16.5" cy="15.5" r="2.5" fill="#B99A5E"/>
  </svg>
</button>

<div class="page">

  <!-- ═══ 封面 ═══ -->
  <header class="hero">
    <div class="hero-inner">
      <p class="hero-kicker">Wedding Invitation</p>
      <div class="cover-photo" id="coverPhoto">
        <div class="photo-hint">
          <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="#8C867C" stroke-width="1.2">
            <rect x="2" y="5" width="26" height="16" rx="2"/>
            <circle cx="15" cy="12.5" r="3.5"/>
            <path d="M10 5l1.5-3h7L20 5"/>
          </svg>
          <span>封面照片</span>
          <span>替换 cover.jpg</span>
        </div>
      </div>
      <h1 class="hero-names"><span data-bind="groomName"></span><span class="amp">&amp;</span><span data-bind="brideName"></span></h1>
      <div class="gold-line"></div>
      <p class="hero-date" data-row><span data-bind="dateText"></span></p>
      <p class="hero-lunar" data-row><span data-bind="lunarText"></span></p>
    </div>
    <div class="scroll-hint">SCROLL</div>
  </header>

  <!-- ═══ 邀请正文 ═══ -->
  <section class="invite">
    <h2 class="invite-title reveal">诚邀</h2>
    <p class="invitee-name reveal" data-row>亲爱的 <span data-bind="invitee"></span></p>
    <div class="invite-text reveal">
      <p>我们将在 <span class="em" data-bind="dateText"></span>，于<br><span class="em" data-bind="hotelName"></span><br>举行结婚典礼。</p>
      <p>您的到来，将是这场仪式上<br>最温暖的祝福。</p>

    <p class="invite-sign reveal">新郎 <span data-bind="groomName"></span> &amp; 新娘 <span data-bind="brideName"></span> 敬邀</p>

  <!-- ═══ 婚礼信息 ═══ -->
  <section class="info">
    <div class="section-head reveal">
      <span class="en">Ceremony</span>
      <span class="cn">婚礼信息</span>
    </div>
    <div class="info-card reveal">
      <div class="info-row">
        <span class="label">时 间</span>
        <span class="value" data-bind="timeText"></span>
      </div>
      <div class="info-row">
        <span class="label">日 期</span>
        <span class="value" data-bind="dateText"></span>
      </div>
      <div class="info-row" data-row>
        <span class="label">农 历</span>
        <span class="value" data-bind="lunarText"></span>
      </div>
      <div class="info-row">
        <span class="label">地 点</span>
        <span class="value" data-bind="hotelName"></span>
      </div>
      <div class="info-row">
        <span class="label">地 址</span>
        <span class="value" data-bind="address"></span>
      </div>
      <div class="schedule">
        <p class="schedule-title">婚 礼 流 程</p>
        <div class="schedule-item" data-row>
          <span class="s-time" data-bind="schedule1Time"></span>
          <span class="s-dot"></span>
          <span class="s-text" data-bind="schedule1Text"></span>
        </div>
        <div class="schedule-item" data-row>
          <span class="s-time" data-bind="schedule2Time"></span>
          <span class="s-dot"></span>
          <span class="s-text" data-bind="schedule2Text"></span>
        </div>
        <div class="schedule-item" data-row>
          <span class="s-time" data-bind="schedule3Time"></span>
          <span class="s-dot"></span>
          <span class="s-text" data-bind="schedule3Text"></span>
        </div>
        <div class="schedule-item" data-row>
          <span class="s-time" data-bind="schedule4Time"></span>
          <span class="s-dot"></span>
          <span class="s-text" data-bind="schedule4Text"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ 交通与地图 ═══ -->
  <section class="map-section">
    <div class="section-head reveal">
      <span class="en">Getting There</span>
      <span class="cn">交通指引</span>
    </div>
    <div class="traffic-list reveal">
      <div class="traffic-item" data-row>
        <span class="t-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <rect x="4" y="4" width="16" height="14" rx="3"/>
            <path d="M8 21h8M12 18v3"/>
            <path d="M8.5 9.5h7M8.5 12.5h4"/>
          </svg>
        </span>
        <span class="t-text" data-bind="traffic1"></span>
      </div>
      <div class="traffic-item" data-row>
        <span class="t-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5h12v10H4zM16 9h3l2 3v3h-5z"/>
            <circle cx="7.5" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>
          </svg>
        </span>
        <span class="t-text" data-bind="traffic2"></span>
      </div>
      <div class="traffic-item" data-row>
        <span class="t-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17l5-12 4 6 3-3 6 9H3z"/>
            <circle cx="7" cy="18.5" r="1.6"/><circle cx="17" cy="18.5" r="1.6"/>

        </span>
        <span class="t-text" data-bind="traffic3"></span>
      </div>

           如需更换地点：改上方 iframe 的 position=经度,纬度 与 name=名称 参数即可，

    <p class="footer-date reveal">2026 · 10 · 01</p>
  </footer>

</div>

<audio id="bgm" loop preload="none"></audio>

<script>
/* ═══════════════════════════════════════════════════════════
   配置区：只改这里！改完保存刷新即可生效。
   - 留空 "" 的字段：对应行自动隐藏（如 lunarText 留空则农历行不显示）
   - coverPhoto 取值：""（保持占位） / "cover.jpg"（同目录照片） / "data:image/jpeg;base64,..."（内嵌）
   - musicSrc 取值：""（隐藏音乐按钮） / "music.mp3"（同目录音乐） / "data:audio/mpeg;base64,..."（内嵌）
   ═══════════════════════════════════════════════════════════ */
var CONFIG = {
  groomName: "张伟",
  brideName: "李婷",

  address: "十堰市茅箭区朝阳中路25号",

  schedule1Time: "10:00", schedule1Text: "迎宾签到",

  schedule3Time: "12:00", schedule3Text: "喜宴开席",

  traffic1: "",
  traffic2: "公交 X 路至 X 站，下车即达",
  traffic3: "自驾导航搜索「十堰市武当国际酒店」",
  coverPhoto: "",
  musicSrc: "music.mp3"
};
/* ═══════════ 以下为初始化逻辑，无需修改 ═══════════ */

(function () {
  /* ---- 1. 数据绑定：CONFIG → [data-bind]，空值隐藏所在行 ---- */
  var binds = document.querySelectorAll("[data-bind]");
  for (var i = 0; i < binds.length; i++) {
    var el = binds[i];
    var val = CONFIG[el.getAttribute("data-bind")];
    if (val === undefined || val === "") {
      var row = el.parentNode;
      while (row && row !== document.body && !(row.getAttribute && row.getAttribute("data-row"))) {
        row = row.parentNode;
      }
      if (row && row.getAttribute && row.getAttribute("data-row")) row.classList.add("hidden");
    } else {
      el.textContent = val;
    }
  }

  /* ---- 2. 封面照片 ---- */
  var photoBox = document.getElementById("coverPhoto");
  if (photoBox && CONFIG.coverPhoto) {
    var img = new Image();
    img.alt = "";
    img.onload = function () { photoBox.appendChild(img); photoBox.classList.add("has-photo"); };
    img.onerror = function () { console.warn("封面照片加载失败，请检查 CONFIG.coverPhoto"); };
    img.src = CONFIG.coverPhoto;
  }

  /* ---- 3. 背景音乐（首次点击时加载并播放，满足微信 iOS 手势内播放限制）---- */
  var btn = document.getElementById("musicBtn");
  var bgm = document.getElementById("bgm");
  if (CONFIG.musicSrc) {
    var playing = false;
    btn.addEventListener("click", function () {
      if (!bgm.getAttribute("src")) bgm.setAttribute("src", CONFIG.musicSrc);
      if (playing) {
        bgm.pause();
      } else {
        var pr = bgm.play();
        if (pr && pr.catch) pr.catch(function () { playing = false; btn.classList.remove("playing"); });
      }
    });
    bgm.addEventListener("play", function () { playing = true; btn.classList.add("playing"); });
    bgm.addEventListener("pause", function () { playing = false; btn.classList.remove("playing"); });
    bgm.addEventListener("error", function () {
      btn.classList.add("music-error");
      console.warn("音乐文件未找到，请检查 CONFIG.musicSrc（文件需与 HTML 同目录）");
    });
  } else {
    btn.style.display = "none";
  }

  /* ---- 4. 花瓣 ---- */
  var petalsWrap = document.getElementById("petals");
  var reduced = false;
  try { if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) reduced = true; } catch (e) {}
  if (petalsWrap && !reduced) {
    var count = window.innerWidth < 480 ? 14 : 22;
    try { if (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) count = Math.floor(count / 2); } catch (e) {}
    var frag = document.createDocumentFragment();
    for (var p = 0; p < count; p++) {
      var petal = document.createElement("div");
      petal.className = "petal";
      var size = 6 + Math.random() * 16;
      var dur = 8 + Math.random() * 6;
      var drift = 20 + Math.random() * 40;
      petal.style.width = size + "px";
      petal.style.height = Math.round(size * 0.62) + "px";
      petal.style.left = (Math.random() * 100) + "vw";
      petal.style.setProperty("--dur", dur + "s");
      petal.style.setProperty("--drift", drift + "px");
      petal.style.setProperty("--driftN", (-drift) + "px");
      petal.style.setProperty("--delay", (-Math.random() * dur) + "s");
      petal.style.setProperty("--rot1", Math.round(Math.random() * 360) + "deg");
      petal.style.setProperty("--rot2", Math.round(Math.random() * 360) + "deg");
      petal.style.setProperty("--rot3", Math.round(Math.random() * 360) + "deg");
      petal.style.setProperty("--rot4", Math.round(Math.random() * 360) + "deg");
      petal.style.setProperty("--op", (0.3 + Math.random() * 0.4).toFixed(2));
      frag.appendChild(petal);
    }
    petalsWrap.appendChild(frag);
  }

  /* ---- 5. 滚动淡入 ---- */
  var items = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      for (var e = 0; e < entries.length; e++) {
        if (entries[e].isIntersecting) {
          entries[e].target.classList.add("is-visible");
          io.unobserve(entries[e].target);
        }
      }
    }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });
    for (var r = 0; r < items.length; r++) io.observe(items[r]);
  } else {
    for (var d = 0; d < items.length; d++) items[d].classList.add("is-visible");
  }

  /* ---- 6. 封面开场淡入 ---- */
  document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.add("ready");
  });
})();
</script>
</body>
</html>
